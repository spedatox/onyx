<!DOCTYPE html>
<html lang="tr" class="dark">

    <title>404 — Onyx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        <a href="/" class="inline-block bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition shadow">Panele Dön</a>

</html>
